name: Deploy to Server

on:
  workflow_dispatch: # 手动触发部署

jobs:
  deploy:
    runs-on: [self-hosted, jinan-1]
    
    steps:
      - name: 1. 拉取最新代码
        run: |
          echo "Checking out ${{ github.ref_name }}..."
          # 使用 GITHUB_TOKEN 解决私有仓库拉取时的用户名密码问题
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          
          if [ ! -d ".git" ]; then
            git clone --depth 1 -b ${{ github.ref_name }} $REPO_URL .
          else
            git remote set-url origin $REPO_URL
            git fetch origin ${{ github.ref_name }} --depth 1
            git reset --hard FETCH_HEAD
          fi

      - name: 2. 执行容器部署
        run: |
          # 1. 获取小写的镜像 ID
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo "${IMAGE_ID}" | tr '[A-Z]' '[a-z]')
          
          # 2. 处理版本号
          SAFE_VERSION=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          IMAGE_FULL_NAME="${IMAGE_ID}:${SAFE_VERSION}"
          
          echo "🚀 正在部署镜像: ${IMAGE_FULL_NAME}"

          # 3. 将变量写入 .env 文件供 docker-compose 使用
          echo "IMAGE_FULL_NAME=${IMAGE_FULL_NAME}" > .env

          # 4. 登录镜像库
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # 5. 部署
          docker compose pull
          docker compose up -d
          
          # 6. 清理过期镜像
          docker image prune -f
          echo "✅ 部署完成！"
