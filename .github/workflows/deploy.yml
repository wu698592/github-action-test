name: Deploy to Server

on:
  workflow_dispatch: # 手动触发部署
    inputs:
          manual_tag:
            description: '【可选】手动指定镜像 Tag (如: sha-1663e5d)。留空则自动按分支或tag Hash 部署。'
            required: false
            default: ''
            
jobs:
  deploy:
    runs-on: [self-hosted, jinan-1]
      
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      # ✨ tr '[A-Z]' '[a-z]' 逻辑
      - name: 2. 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # 自动处理 sha-xxxxxxx 格式
            type=sha,format=short,prefix=sha-
            # 如果是 Tag 触发，自动处理 v1.2.3 格式
            type=ref,event=tag

      # ✨ docker login 逻辑
      - name: 3. 登录 GitHub 镜像库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. 深度排错部署
        run: |
          # --- [诊断 1] 基础变量检查 ---
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[A-Z]' '[a-z]')
          OWNER_NAME=$(echo "${{ github.repository_owner }}" | tr '[A-Z]' '[a-z]')
          DEPLOY_DIR="/data1/${REPO_NAME}"

          if [ -n "${{ github.event.inputs.manual_tag }}" ]; then
            IMAGE_FULL_NAME="ghcr.io/${OWNER_NAME}/${REPO_NAME}:${{ github.event.inputs.manual_tag }}"
          else
            IMAGE_FULL_NAME="${{ fromJson(steps.meta.outputs.json).tags[0] }}"
          fi
          IMAGE_FULL_NAME=$(echo "$IMAGE_FULL_NAME" | tr '[A-Z]' '[a-z]')

          echo "🔍 [CHECK] 最终生成的变量 IMAGE_FULL_NAME 为: ${IMAGE_FULL_NAME}"

          # --- [诊断 2] 目录与文件状态 ---
          mkdir -p "$DEPLOY_DIR"
          echo "📂 [CHECK] 当前工作目录 (PWD): $(pwd)"
          echo "📂 [CHECK] 目标部署目录 (DEPLOY_DIR): ${DEPLOY_DIR}"
          
          # 同步代码
          rsync -avz --delete --exclude '.git' --exclude '.env*' ./ ${DEPLOY_DIR}/
          
          cd ${DEPLOY_DIR}
          echo "📂 [CHECK] 进入目录后的 PWD: $(pwd)"
          echo "📄 [CHECK] 当前目录下的文件清单:"
          ls -la

          # --- [诊断 3] YAML 内容校验 ---
          echo "📄 [CHECK] docker-compose.yml 中关于 image 的定义如下:"
          grep "image:" docker-compose.yml || echo "❌ 警告：在 yml 中没找到 image 关键字！"

          # --- [诊断 4] 变量写入校验 ---
          echo "IMAGE_FULL_NAME=${IMAGE_FULL_NAME}" > .env.image
          printf "%b" "${{ secrets.ENV_FILE_CONTENT }}" > .env
          
          echo "📄 [CHECK] .env.image 文件内容:"
          cat .env.image
          echo "📄 [CHECK] .env 文件末尾几行 (脱敏):"
          tail -n 3 .env | sed 's/./*/g' # 仅确认有内容写入

          # --- [诊断 5] Docker 环境感知测试 ---
          echo "🐳 [CHECK] 尝试在不运行命令的情况下，让 Compose 解析配置:"
          # 使用 config 命令可以查看 Compose 最终解析出来的结果，不真正启动
          IMAGE_FULL_NAME=${IMAGE_FULL_NAME} docker compose config

          # --- [诊断 6] 最终尝试启动 ---
          echo "🚀 [EXEC] 执行最终启动命令..."
          IMAGE_FULL_NAME=${IMAGE_FULL_NAME} docker compose up -d --force-recreate