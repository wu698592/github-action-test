name: Deploy to Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, jinan-1]
    
    steps:
      - name: 1. 优化 Git 环境 (解决网络握手问题)
        run: |
          # 最佳实践：在 checkout 前注入稳定性配置
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

      - name: 2. 拉取代码 (使用官方插件)
        uses: actions/checkout@v4
        with:
          # 只拉取一层，减少传输时间，降低连接中断概率
          fetch-depth: 1

      - name: 3. 执行容器部署
        run: |
          # 准备镜像元数据
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo "${IMAGE_ID}" | tr '[A-Z]' '[a-z]')
          
          # 自动识别 UI 选的分支/Tag
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          export IMAGE_FULL_NAME="${IMAGE_ID}:${VERSION}"
          
          echo "🚀 准备部署: ${IMAGE_FULL_NAME}"

          # 登录 GitHub 镜像库 (推荐使用内置 GITHUB_TOKEN)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # 部署流程
          docker compose pull
          docker compose up -d
          
          # 清理旧镜像
          docker image prune -f
          echo "✅ 部署成功！"
