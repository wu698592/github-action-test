name: Deploy to Server
run-name: >-
  ${{
    github.event.inputs.manual_tag != '' && '🛑【输入指定版本发布】' ||
    github.ref_type == 'tag' && '🚀【正式发布】' ||
    '🚲【测试发布】'
  }}
  - ${{ github.event.inputs.manual_tag != '' && github.event.inputs.manual_tag || github.ref_name }}
  - (@${{ github.actor }})
  - @${{ github.sha }}
  
on:
  workflow_dispatch:
    inputs:
      manual_tag:
        description: '可选：填写要部署的镜像 Tag（如 v1.0.1 或 sha-1663e5d）。留空则按上方选择的分支或 Tag 部署。'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: [self-hosted, jinan-1]

    env:
      DEPLOY_FILES: "Dockerfile docker-compose.yml requirements.txt nginx.conf"
      DEPLOY_DIRS: "nginx"

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.manual_tag || github.sha }}
          sparse-checkout: |
            nginx/
            Dockerfile
            docker-compose.yml
            requirements.txt
            nginx.conf
          sparse-checkout-cone-mode: false

      - name: 2. 基于当前触发环境（Commit 或 Tag）生成对应的镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: 3. 登录 GitHub 镜像库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. 确定镜像全名
        id: get_info
        run: |
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[A-Z]' '[a-z]')
          OWNER_NAME=$(echo "${{ github.repository_owner }}" | tr '[A-Z]' '[a-z]')
          
          if [ -n "${{ github.event.inputs.manual_tag }}" ]; then
            IMAGE="ghcr.io/${OWNER_NAME}/${REPO_NAME}:${{ github.event.inputs.manual_tag }}"
          else
            IMAGE=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[] | select(contains("sha-"))' | head -n 1)
          fi
          
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[A-Z]' '[a-z]')
          echo "IMAGE_NAME=$IMAGE_LOWER" >> $GITHUB_ENV
          echo "REPO_LOWER=$REPO_NAME" >> $GITHUB_ENV
          echo "🚀 目标镜像: $IMAGE_LOWER"

      - name: 5. 拉取镜像
        run: |
          echo "🔍 正在检查镜像是否存在: ${{ env.IMAGE_NAME }}"
          if ! docker pull ${{ env.IMAGE_NAME }}; then
            echo "::error::在 GHCR 中找不到镜像 [${{ env.IMAGE_NAME }}]。请先运行 Build 工作流！"
            exit 1
          fi

      - name: 6. 同步配置文件
        run: |
          DEPLOY_DIR="/data1/${{ env.REPO_LOWER }}"
          NGINX_DEST_DIR="/data1/nginx/nginx-conf/conf.d"
          
          mkdir -p "$DEPLOY_DIR"
          
          for file in ${{ env.DEPLOY_FILES }}; do
            [ -f "$file" ] && cp -f "$file" "$DEPLOY_DIR/" && echo "✅ 复制: $file"
          done
          
          for dir in ${{ env.DEPLOY_DIRS }}; do
            [ -d "$dir" ] && rsync -avz --delete "$dir/" "$DEPLOY_DIR/$dir/"
          done

          if [ -d "./nginx" ]; then
            mkdir -p $NGINX_DEST_DIR
            find "./nginx" -name "*.inc" -type f -exec cp {} $NGINX_DEST_DIR/ \;
            echo "✅ Nginx .inc 文件同步完成"
          fi

      - name: 7. 启动 Docker 容器
        run: |
          cd /data1/${{ env.REPO_LOWER }}
          export IMAGE_FULL_NAME=${{ env.IMAGE_NAME }}
          printf "%b" "${{ secrets.ENV_FILE_CONTENT }}" > .env
          
          docker compose --env-file .env up -d --force-recreate

          sleep 15
          
          TOTAL_SERVICES=$(docker compose config --services | wc -l)
          RUNNING_COUNT=$(docker compose ps --format "{{.State}}" | grep -E "running|Up" | wc -l)
          
          echo "📊 状态汇总: 预期服务数 $TOTAL_SERVICES, 实际运行数 $RUNNING_COUNT"
          
          if [ "$RUNNING_COUNT" -lt "$TOTAL_SERVICES" ]; then
            echo "❌ 部分容器启动失败，打印项目日志："
            docker compose logs --tail 100
            exit 1
          else
            echo "✅ 所有容器 ($RUNNING_COUNT/$TOTAL_SERVICES) 运行正常"
            docker compose logs --tail 20
          fi

      - name: 8. 刷新 Nginx 配置
        run: |
          if docker exec iam_nginx_proxy nginx -t; then
              docker exec iam_nginx_proxy nginx -s reload
              echo "✅ Nginx 热重载成功"
          else
              echo "::error::Nginx 配置语法错误，未执行重载！"
              exit 1
          fi

      - name: 9. 清理旧镜像
        run: docker image prune -af --filter "until=168h"
