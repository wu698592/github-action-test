name: Build

on:
  push:
    tags:
      - 'v*'  # 当你推送 v1.0 等标签时自动触发
  workflow_dispatch:
    inputs:
      version_tag:
        description: '请输入要打包的 Tag (请确保该 Tag 已推送到 Git)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4
        with:
          # 核心修复：手动运行用 inputs，自动推送用 github.ref_name
          ref: ${{ github.event.inputs.version_tag || github.ref_name }}

      - name: 2. 登录 GitHub 镜像库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 3. 构建并推送镜像
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          
          # 核心修复：确定最终的版本号
          VERSION=${{ github.event.inputs.version_tag || github.ref_name }}
          
          echo "正在构建镜像: $IMAGE_ID:$VERSION"
          
          docker build . -t $IMAGE_ID:$VERSION -t $IMAGE_ID:latest
          
          docker push $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:latest
