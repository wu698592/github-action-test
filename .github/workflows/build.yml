name: Build and Push Image

on:
  push:
    tags:
      - 'v*'  # 自动触发：正式版
  workflow_dispatch:
    # 手动触发：无需输入，直接选分支即可

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. 登录 GitHub 镜像库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. 生成镜像元数据
        id: meta
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo "${IMAGE_ID}" | tr '[A-Z]' '[a-z]')
          
          # 如果是 Tag 触发 (refs/tags/v1.0.0)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${{ github.ref_name }}
            # 正式版同时打 latest 和 版本号标签
            TAGS="${IMAGE_ID}:latest,${IMAGE_ID}:${VERSION}"
          else
            # 如果是分支触发，标签名即为分支名 (处理掉斜杠防止报错)
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            TAGS="${IMAGE_ID}:${VERSION}"
          fi
          
          echo "TAGS=${TAGS}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: 5. 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. 状态报告
        run: |
          echo "✅ 构建成功！"
          echo "镜像版本: ${{ steps.meta.outputs.VERSION }}"
