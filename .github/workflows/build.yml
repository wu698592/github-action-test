name: Build and Push Image (Tags Only)

on:
  push:
    tags:
      - 'v*'  # 自动触发：仅限 v 开头的 tag
  workflow_dispatch:
    inputs:
      version_tag:
        description: '手动输入版本号 (必须是已存在的 Tag，如 v1.0.0)'
        required: true
        # 移除了 default: 'main' 这种分支导向的默认值

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 增加一个判断：如果是手动触发，确保它不是在跑分支（可选安全检查）
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    
    permissions:
      packages: write
      contents: read

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4
        with:
          # 强制拉取指定的 tag
          ref: ${{ github.event.inputs.version_tag || github.ref_name }}
          fetch-depth: 0 # 如果你的构建逻辑依赖于 git tags 历史，建议开启

      - name: 2. 检查是否为有效 Tag
        run: |
          # 如果是手动触发，校验一下输入格式是否符合你的规范（例如必须 v 开头）
          INPUT_TAG="${{ github.event.inputs.version_tag }}"
          if [[ -n "$INPUT_TAG" && ! "$INPUT_TAG" =~ ^v[0-9] ]]; then
            echo "❌ 错误: 输入的 '$INPUT_TAG' 不符合版本规范 (必须以 v 开头)"
            exit 1
          fi

      - name: 3. 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. 登录 GitHub 镜像库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 建议直接用内置的 GITHUB_TOKEN，通常无需自定义秘钥

      - name: 5. 提取镜像元数据
        id: meta
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          
          RAW_VERSION=${{ github.event.inputs.version_tag || github.ref_name }}
          # 仅提取数字版本
          VERSION=$(echo $RAW_VERSION | sed 's/^v//')
          
          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "RAW_VERSION=$RAW_VERSION" >> $GITHUB_OUTPUT

      - name: 6. 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.IMAGE_ID }}:latest
            ${{ steps.meta.outputs.IMAGE_ID }}:${{ steps.meta.outputs.RAW_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
