name: Build and Push Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: '手动输入 Tag 或分支名 (如 v1.0.0 或 main)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4
        with:
          # 自动触发用 github.ref_name，手动用 inputs
          ref: ${{ github.event.inputs.version_tag || github.ref_name }}

      - name: 2. 设置 Docker Buildx (启用缓存支持)
        uses: docker/setup-buildx-action@v3

      - name: 3. 登录 GitHub 镜像库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 4. 提取镜像元数据
        id: meta
        run: |
          # 准备镜像名
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          
          # 确定版本号
          RAW_VERSION=${{ github.event.inputs.version_tag || github.ref_name }}
          # 移除 v 前缀得到纯数字版本 (可选，如 v1.0 -> 1.0)
          VERSION=$(echo $RAW_VERSION | sed 's/^v//')
          
          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "RAW_VERSION=$RAW_VERSION" >> $GITHUB_OUTPUT

      - name: 5. 构建并推送 (智能缓存版)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 同时打三个标：最新版(latest)、带v版本(v1.0)、纯数字版本(1.0)
          tags: |
            ${{ steps.meta.outputs.IMAGE_ID }}:latest
            ${{ steps.meta.outputs.IMAGE_ID }}:${{ steps.meta.outputs.RAW_VERSION }}
            ${{ steps.meta.outputs.IMAGE_ID }}:${{ steps.meta.outputs.VERSION }}
          # 启用 GitHub Actions 缓存，显著提升二次构建速度
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. 打印状态
        run: |
          echo "✅ 镜像构建成功!"
          echo "地址: ${{ steps.meta.outputs.IMAGE_ID }}:${{ steps.meta.outputs.RAW_VERSION }}"
