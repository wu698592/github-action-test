name: Build and Push Image

on:
  push:
    tags:
      - 'v*'  # 自动触发：正式版本
  workflow_dispatch:
    # 手动触发：不需要输入 Tag，直接选分支即可

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4
        # 这里不指定 ref，它会自动使用触发时的 tag 或手动选中的 branch

      - name: 2. 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. 登录 GitHub 镜像库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. 提取镜像元数据 (区分 Tag 和 Branch)
        id: meta
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          
          # 判断是 Tag 触发还是手动触发
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # --- 正式版本逻辑 ---
            RAW_VERSION=${{ github.ref_name }}
            VERSION=$(echo $RAW_VERSION | sed 's/^v//')
            TAGS="${IMAGE_ID}:latest,${IMAGE_ID}:${RAW_VERSION},${IMAGE_ID}:${VERSION}"
            echo "MODE=Release (Tag)" >> $GITHUB_OUTPUT
          else
            # --- 手动/分支逻辑 ---
            # 使用分支名作为镜像标签，并加上时间戳或 sha 避免冲突
            BRANCH_NAME=$(echo ${{ github.ref_name }} | sed 's/\//-/g') # 处理 feature/xxx 这种带斜杠的分支名
            TAGS="${IMAGE_ID}:${BRANCH_NAME}"
            echo "MODE=Manual (Branch)" >> $GITHUB_OUTPUT
          fi
          
          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_OUTPUT
          echo "TAGS=$TAGS" >> $GITHUB_OUTPUT

      - name: 5. 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. 打印状态
        run: |
          echo "✅ 构建模式: ${{ steps.meta.outputs.MODE }}"
          echo "地址: ${{ steps.meta.outputs.TAGS }}"
