name: 01-手动打包镜像

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: '请输入要打包的 Tag (请确保该 Tag 已推送到 Git)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: 1. 拉取指定 Tag 的代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version_tag }} # 精准对齐：Tag 不存在则报错

      - name: 2. 登录 GitHub 镜像库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }} # 使用你的 PAT 保证权限

      - name: 3. 构建并推送镜像
        run: |
          # 转换镜像名为全小写
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=${{ github.event.inputs.version_tag }}
          
          echo "正在构建镜像: $IMAGE_ID:$VERSION"
          
          # 构建并同时打上版本标签和 latest 标签
          docker build . -t $IMAGE_ID:$VERSION -t $IMAGE_ID:latest
          
          docker push $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:latest
