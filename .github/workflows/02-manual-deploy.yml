name: 02-手动部署到服务器

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: '请输入要部署的版本号 (需已在 Packages 中存在)'
        required: true
        default: 'v1.0.0'

jobs:
  deploy:
    # 1. 核心修改：改为你刚才安装好的 Runner
    runs-on: self-hosted

    steps:
      - name: 1. 拉取代码到服务器本地
        uses: actions/checkout@v4

      - name: 2. 部署容器
        run: |
          # 因为 runs-on: self-hosted，以下命令直接在你的内网服务器执行
          
          # 进入项目目录 (Runner 会自动创建路径，通常不需要 cd，但为了保险可以根据你的 vars 改)
          # 注意：checkout 默认会把代码拉到当前目录
          
          # 准备镜像名
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=${{ github.event.inputs.version_tag }}
          
          # 登录 GitHub 镜像库
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # 设置变量并启动
          export IMAGE_FULL_NAME=$IMAGE_ID:$VERSION
          
          echo "开始拉取镜像并部署: $IMAGE_FULL_NAME"
          docker compose pull
          docker compose up -d
          
          # 清理
          docker image prune -f
          echo "🚀 部署完成！版本：$VERSION"
