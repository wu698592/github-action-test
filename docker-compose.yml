services:
  ${CONTAINER_NAME}:
    image: ${IMAGE_FULL_NAME}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/nginx.conf  # 前端用
      - ${LOG_DIR}:/var/log/nginx
    environment:
      - TZ=Asia/Shanghai
    networks:
      - ${NETWORK_NAME}

networks:
  ${NETWORK_NAME}:
    external: true